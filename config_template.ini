[spotify]
client_id = your_spotify_client_id_here
client_secret = your_spotify_client_secret_here

[qobuz]
email = your_qobuz_email_here
# Qobuz no longer accepts plain-text passwords via the API (as of 2026).
# You must supply a user_auth_token instead:
#   1. Log into play.qobuz.com in your browser
#   2. Open DevTools (F12) → Network tab, play any track
#   3. Find the POST request to user/login → Response → copy user_auth_token
#      (Chrome/Safari: Application → Local Storage → play.qobuz.com → localuser)
#   4. Paste the token below as the value of "password"
password = your_qobuz_user_auth_token_here

[loudness]
# ReplayGain 2.0 / EBU R128 loudness normalization.
#
# When enabled, every track downloaded by the `download` command is analyzed
# and tagged with ReplayGain gain/peak values.  The audio is never modified —
# a ReplayGain-aware player reads the tags and adjusts volume at playback, so
# the process is fully reversible.  You can also run it on an existing library
# at any time with `spotqo-dl normalize /path/to/music`.
#
# CLI flags (--replaygain / --rg-target) override these values.

# Analyze and tag tracks automatically on download (default: false).
enabled = false

# Reference loudness in LUFS.  -18 is the ReplayGain 2.0 standard.  Use a
# higher value (e.g. -14, the streaming norm) for a louder baseline.
target = -18.0

# Also compute album-gain values (one gated measurement per album folder) so
# players in album mode keep the relative dynamics between tracks.
album_gain = true

# Reduce a track's gain if applying it would push its true peak above -1 dBTP.
prevent_clipping = true

# Number of files analyzed in parallel (each is an independent ffmpeg pass).
jobs = 4

# [tidal]
# Tidal authentication is managed entirely by tiddl — no credentials go here.
# Run the following command once to authenticate with your Tidal account:
#
#   tiddl auth login
#
# spotqo-dl will then automatically read your session token from
# ~/.tiddl/config.toml (or $TIDDL_PATH/config.toml if set).
# Tidal is used as a fallback when Qobuz cannot find a Spotify track,
# and also accepts direct Tidal URLs via the download command.
